name: CI

# Every push to every branch runs the full check-and-package pipeline. A push
# to `main` additionally DEPLOYS from the end of that same job: crates.io and
# PyPI, both authenticated with repository secrets, both skipped when that version
# is already published, so a main push without a version bump is a no-op, not a red
# build. `workflow_dispatch` allows a manual re-run from the Actions tab.
on:
  push:
    branches: ["**"]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a `main` run halfway through a publish; PR/branch runs may be.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned so the wheel is linked against the same libtorch major/minor that
  # `python/gras/__init__.py` and README.md document. The CPU distribution is
  # ~200 MB; the cache below keeps it off the wire on most runs.
  LIBTORCH_VERSION: "2.10.0+cpu"
  LIBTORCH_URL: "https://download.pytorch.org/libtorch/cpu/libtorch-shared-with-deps-2.10.0%2Bcpu.zip"
  # Must be the directory that contains lib/ — `gras`'s build and the Python
  # package both read this (env_setup.sh's local ~/.flodl path does not exist
  # on a fresh runner).
  LIBTORCH_PATH: ${{ github.workspace }}/libtorch
  # Tests and examples link libtorch dynamically; LIBTORCH_PATH tells the build
  # where it is, this tells the loader.
  LD_LIBRARY_PATH: ${{ github.workspace }}/libtorch/lib
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Test, build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache libtorch (CPU)
        uses: actions/cache@v4
        with:
          path: ${{ env.LIBTORCH_PATH }}
          key: libtorch-${{ runner.os }}-${{ env.LIBTORCH_VERSION }}

      - name: Install libtorch (CPU)
        run: |
          set -euo pipefail
          if [ -f "$LIBTORCH_PATH/lib/libtorch_cpu.so" ]; then
            echo "libtorch restored from cache: $LIBTORCH_PATH"
            exit 0
          fi
          curl --fail --location --retry 3 --output /tmp/libtorch.zip "$LIBTORCH_URL"
          rm -rf /tmp/libtorch-extract
          unzip -q /tmp/libtorch.zip -d /tmp/libtorch-extract
          mkdir -p "$(dirname "$LIBTORCH_PATH")"
          mv /tmp/libtorch-extract/libtorch "$LIBTORCH_PATH"
          test -f "$LIBTORCH_PATH/lib/libtorch_cpu.so"

      # The crate declares rust-version = 1.91; pin the toolchain here so a
      # breakage is never mistaken for a newer compiler regression. The action
      # installs a minimal profile, so rustfmt and clippy are NOT present unless
      # named here — without `components`, `cargo fmt --check` dies instantly
      # with "'cargo-fmt' is not installed".
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test (Rust)
        run: cargo test -p gras --locked

      # `make lint` runs the fixer; CI checks instead, so a dirty tree is caught.
      - name: Check formatting
        run: cargo fmt --all -- --check

      # Warnings are reported, not fatal — same policy as `make lint`.
      - name: Lint (clippy)
        run: cargo clippy --all-targets

      - name: Build docs
        run: cargo doc --no-deps

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Coverage (cargo tarpaulin)
        run: cargo tarpaulin --out Html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: tarpaulin-report.html
          if-no-files-found: warn
          retention-days: 14

      # Rehearsal on every branch: builds the crate exactly as crates.io would
      # receive it, then stops before upload. The real upload only happens in the
      # deploy steps at the end of this job, and only on `main`.
      - name: Verify crate packaging (dry run)
        run: cargo publish -p gras --dry-run --locked

      - name: Set up Python 3.12 + uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build wheel
        run: uvx maturin@1.15.0 build --release --out dist

      - name: Build sdist
        run: uvx maturin@1.15.0 sdist --out dist

      - name: Validate package metadata
        run: uvx twine check dist/*

      # Proves the wheel and its dynamic libtorch link actually work on a clean
      # interpreter, not just that maturin produced a file.
      - name: Smoke-test the wheel
        run: |
          set -euo pipefail
          uv venv /tmp/smoke --python 3.12
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import gras; print('gras', gras.__version__)"

      # `data/` is gitignored, so the fixtures these tests read do not exist on a
      # fresh checkout: build them with the wheel's own `from_arrays` on-ramp.
      - name: Generate the test dataset
        run: |
          set -euo pipefail
          uv pip install --python /tmp/smoke/bin/python numpy
          mkdir -p data
          /tmp/smoke/bin/python - <<'PY'
          import tempfile
          from pathlib import Path

          import numpy as np
          from gras import RaceConfig, RaceEngine

          rng = np.random.default_rng(0)
          x = rng.normal(size=(256, 2)).astype(np.float32)
          y = np.zeros((256, 3), dtype=np.float32)
          y[np.arange(256), rng.integers(0, 3, 256)] = 1.0
          data = Path("data/blobs")
          with tempfile.TemporaryDirectory() as tmp:
              RaceEngine.from_arrays(x, y, data, RaceConfig(log_level="none"), seed=0, run_dir=tmp)
          print("wrote", sorted(p.name for p in data.iterdir()))
          PY

      - name: Test the Python bindings
        run: |
          set -euo pipefail
          uv pip install --python /tmp/smoke/bin/python pytest pandas
          # test_determinism exposes `main()`, not `test_*` functions.
          /tmp/smoke/bin/python python/tests/test_determinism.py
          /tmp/smoke/bin/python -m pytest python/tests -q

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gras-engine-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

      # ── Deploy: push to main only, and only after every check above passed ──
      # The version comes from Cargo.toml, so publishing a version that already
      # exists is skipped instead of failing the run.
      - name: Publish crate to crates.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "gras"))')
          # The sparse index is one plain GET; `cargo search` goes through
          # crates.io's rate-limited search API, which a shared runner IP can get
          # throttled on — and a throttled guard means a doomed publish.
          if curl -fsS "https://index.crates.io/gr/as/gras" | grep -q "\"vers\":\"$version\""; then
            echo "gras $version is already on crates.io — nothing to publish"
            exit 0
          fi
          # Belt and braces: a race between the guard and the upload must not fail
          # the run, but any other publish error (bad token, failed verify) still
          # does — it is not swallowed.
          set +e
          output=$(cargo publish -p gras --locked 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ] && printf '%s' "$output" | grep -qE "already (uploaded|exists)"; then
            echo "crates.io already has gras $version — treating as published"
            exit 0
          fi
          exit "$status"

      # API-token auth (works regardless of the PyPI account's username), so it
      # needs repository secret PYPI_API_TOKEN: a token scoped to `gras-engine`.
      # To switch to trusted publishing instead, delete `password:` and add
      # `id-token: write` under `permissions:` (then configure the publisher on
      # PyPI: owner maulberto3, repo gras, workflow ci.yml).
      - name: Publish wheel + sdist to PyPI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Same rule as the crate: a repeated version is a no-op, not a failure.
          skip-existing: true
