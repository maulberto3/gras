[package]
name = "gras"
version = "0.1.9"
edition = "2024"
description = "A Genetic Programming framework for Neural Architecture Search in Rust"
license = "MIT"
homepage = "https://github.com/maulberto3/gras"
repository = "https://github.com/maulberto3/gras"
authors = ["Mauricio Maroto <your.email@example.com>"]

[features]
default = []
cuda = ["flodl/cuda"]

[dependencies]
flodl = "0.7.0"
env_logger = "0.11"
fastrand = "2.5.0"
log = "0.4"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
comfy-table = "7"

[profile.dev]
opt-level = 0
debug = true
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[dev-dependencies]
proptest = "1.11.0"
ureq = "3"
zip = "2"