[project]
name = "gras"
version = "0.1.0"
description = "Python package for gras: dev/test scaffold, target for the upcoming PyO3 bindings"
readme = "README.md"
authors = [
    { name = "Mauricio Maroto", email = "maulberto3@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kaggle>=2.2.4",
    "kagglehub>=1.0.2",
]

# Built by maturin: the module is the Rust extension `gras._core`
# (`gras-py/src/lib.rs`), re-exported by the pure-Python `python/gras/__init__.py`.
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

# The package lives in python/gras/, not src/gras/: this repo's src/ is the Rust
# module tree. maturin compiles the workspace member and drops the shared
# library into that package as `gras/_core.so`.
[tool.maturin]
python-source = "python"
module-name = "gras._core"
manifest-path = "gras-py/Cargo.toml"
