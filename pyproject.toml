[project]
# Distribution name only: `import gras` stays (see module-name below), because
# the PyPI name "gras" belongs to an unrelated package (GRAScanning).
name = "gras-nn"
# Single source of truth: maturin reads `package.version` from
# gras-py/Cargo.toml, which is also what `gras.__version__` reports
# (`env!("CARGO_PKG_VERSION")`). Bump one file, not two.
dynamic = ["version"]
description = "Neural architecture search by genetic programming: a step-race that evolves, trains and ranks flodl networks"
# The Python package has its own README, which is what PyPI renders; the root
# README is the Rust crate's (and the crate's own `readme` is that one).
readme = "python/README.md"
requires-python = ">=3.12"
authors = [
    { name = "Mauricio Maroto", email = "maulberto3@hotmail.com" }
]
license = { text = "MIT" }
keywords = [
    "neural-architecture-search",
    "evolution",
    "genetic-programming",
    "automl",
    "deep-learning",
    "libtorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# No Python runtime dependencies: the extension is Rust, and libtorch is
# loaded at import time from LIBTORCH_PATH / ~/.flodl (python/gras/__init__.py).
# The old scaffold listed `kaggle` + `kagglehub`; nothing in the package or the
# tests imports them, and shipping them would install a Kaggle client for every
# user of a NAS library.
dependencies = []

[project.urls]
Homepage = "https://github.com/maulberto3/gras"
Repository = "https://github.com/maulberto3/gras"
Documentation = "https://docs.rs/gras"

[project.optional-dependencies]
# The checks in python/tests/ read run artifacts back with pandas.
test = ["pandas>=2.0"]

# Built by maturin: the module is the Rust extension `gras._core`
# (`gras-py/src/lib.rs`), re-exported by the pure-Python `python/gras/__init__.py`.
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

# The package lives in python/gras/, not src/gras/: this repo's src/ is the Rust
# module tree. maturin compiles the workspace member and drops the shared
# library into that package as `gras/_core.so`.
[tool.maturin]
python-source = "python"
module-name = "gras._core"
manifest-path = "gras-py/Cargo.toml"
# Debug symbols are useless in a wheel and dominate its size.
strip = true
